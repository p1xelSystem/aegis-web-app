<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aegis">
<title>Aegis</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1622;
  --panel: rgba(11, 22, 34, .92);
  --bubble: #1e3d58;
  --line: #2c5070;
  --text: #dbe7f1;
  --muted: #8fa5b5;
  --accent: #336794;
  --accent-ink: #eaf3fa;
  --danger: #f4708a;
  --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: none; text-size-adjust: none; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 760px;
  margin: 0 auto;
}

/* Header */
header {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  z-index: 2;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { color: var(--accent); display: inline-flex; }
.brand h1 {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .16em;
  color: var(--accent);
  white-space: nowrap;
}
.brand .status {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: pulse 2.4s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.hactions { display: flex; gap: 8px; }
.iconbtn {
  width: 38px; height: 38px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 11px;
  color: var(--muted);
  cursor: pointer;
  transition: color .15s, border-color .15s, transform .1s;
}
.iconbtn:hover, .iconbtn:focus-visible { color: var(--accent); border-color: var(--accent); }
.iconbtn:active { transform: scale(.94); }
.iconbtn.danger:hover, .iconbtn.danger:focus-visible { color: var(--danger); border-color: var(--danger); }

/* Feed */
#scroller {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 18px 14px 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
#feed { display: flex; flex-direction: column; }
.folderbar {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 6px 14px; border-bottom: 1px solid var(--line); font-size: 14px;
}
.folderbar[hidden] { display: none; }
.folderbar label { color: var(--text); }
.folderbar select, #retrySync {
  min-height: 44px; padding: 0 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font: inherit; border-radius: 10px;
}
.folderbar select:focus-visible { outline: 2px solid var(--gold); }
#syncStatus { color: var(--muted); font-size: 13px; flex: 1; min-width: 100px; }
#syncStatus[data-error="true"] { color: var(--danger); }
#retrySync { cursor: pointer; }
#accountName { overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.iconbtn:disabled { opacity: .5; cursor: not-allowed; }

/* Empty state */
.empty {
  height: 100%;
  min-height: 46vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 14px;
  padding: 20px;
}
.empty .mark { color: var(--accent); opacity: .9; }
.empty h2 {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .22em;
  color: var(--text);
}
.empty .tag { color: var(--muted); font-size: 15px; max-width: 30ch; line-height: 1.6; }
.empty .hint {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
  margin-top: 6px;
}

/* Messages */
.msg { display: flex; margin-bottom: 14px; }
.msg.user { justify-content: flex-end; }
.bubble {
  max-width: 84%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 16px;
  line-height: 1.5;
  overflow-wrap: break-word;
  word-break: break-word;
}
.msg.user .bubble {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
  border-bottom-right-radius: 5px;
}
.msg.aegis { align-items: flex-end; flex-direction: column; }
.msg.aegis .who {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .18em;
  color: var(--accent);
  margin: 0 4px 4px;
  align-self: flex-start;
}
.msg.aegis .bubble {
  background: var(--bubble);
  border: 1px solid var(--line);
  border-bottom-left-radius: 5px;
}
.bubble code {
  font-family: var(--font-mono);
  font-size: 13.5px;
  background: #142c42;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 6px;
}
.msg.user .bubble code { background: rgba(234,243,250,.16); border-color: rgba(234,243,250,.28); }
.bubble pre {
  background: #142c42;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  overflow-x: auto;
  margin: 8px 0 4px;
  max-width: 100%;
}
.bubble pre code { background: none; border: none; padding: 0; font-size: 13px; line-height: 1.5; }
.bubble a { color: var(--accent); }

/* Typing indicator */
.dots { display: inline-flex; gap: 5px; padding: 6px 2px; }
.dots i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted);
  animation: blip 1.2s infinite;
}
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blip { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

/* System notes */
.note {
  align-self: center;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--danger);
  text-align: center;
  max-width: 34ch;
  padding: 4px 10px;
  margin-bottom: 14px;
  line-height: 1.5;
}

/* Composer */
#composer {
  flex: none;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
  border-top: 1px solid var(--line);
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  z-index: 2;
}
#input {
  flex: 1;
  font-size: 16px;
  line-height: 1.45;
  font-family: inherit;
  color: var(--text);
  background: #0e1c2c;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 11px 15px;
  outline: none;
  resize: none;
  max-height: 140px;
  min-height: 44px;
  transition: border-color .15s;
}
#input:focus { border-color: var(--accent); }
#input::placeholder { color: #a8bdc9; }
#send {
  flex: none;
  width: 44px; height: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  transition: transform .1s, opacity .15s, background .15s;
}
#send:active { transform: scale(.92); }
#send:disabled { opacity: .35; cursor: default; }

/* Confirm sheet */
#sheet {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(2,4,4,.6);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s;
}
#sheet.open { opacity: 1; pointer-events: auto; }
.sheet-card {
  width: 100%;
  max-width: 760px;
  background: var(--bubble);
  border: 1px solid var(--line);
  border-radius: 22px 22px 0 0;
  padding: 24px 20px calc(env(safe-area-inset-bottom) + 20px);
  transform: translateY(30px);
  transition: transform .18s;
}
#sheet.open .sheet-card { transform: translateY(0); }
.sheet-card h3 {
  font-family: var(--font-display);
  font-size: 17px;
  letter-spacing: .04em;
  margin-bottom: 8px;
}
.sheet-card p { color: var(--muted); font-size: 14px; line-height: 1.55; margin-bottom: 20px; }
.sheet-actions { display: flex; gap: 10px; }
.sheet-actions button {
  flex: 1;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .06em;
  border-radius: 13px;
  padding: 14px;
  cursor: pointer;
  transition: transform .1s;
}
.sheet-actions button:active { transform: scale(.98); }
#cancelWipe {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--line);
}
#wipe {
  background: var(--danger);
  color: #2a060f;
  border: none;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l7.5 3v5.8c0 4.6-3.2 7.9-7.5 10.2C7.7 19.2 4.5 15.9 4.5 11.3V5.5l7.5-3z"/><path d="M9 11.8l2.2 2.2 4-4.5"/></svg>
      </span>
      <h1>AEGIS</h1>
      <span class="status" id="accountName" aria-label="Signed in as __AEGIS_USERNAME__">__AEGIS_USERNAME__</span>
    </div>
    <div class="hactions">
      <button class="iconbtn danger" id="clearBtn" aria-label="Clear history" title="Clear history">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
      </button>
      <button class="iconbtn" id="logoutBtn" aria-label="Log out" title="Log out">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <div class="folderbar" id="folderBar">
    <label for="folder">Chat folder</label>
    <select id="folder">
      <option value="folder-1">Folder 1</option>
      <option value="folder-2">Folder 2</option>
      <option value="folder-3">Folder 3</option>
    </select>
    <span id="syncStatus" role="status"></span>
    <button type="button" id="retrySync" hidden>Retry sync</button>
  </div>

  <main id="scroller">
    <div id="feed"></div>
  </main>

  <div id="composer">
    <textarea id="input" rows="1" maxlength="8000" placeholder="Talk to Aegis&hellip;" aria-label="Message to Aegis"></textarea>
    <button id="send" aria-label="Send message" title="Send" disabled>
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>

<div id="sheet" aria-hidden="true" inert>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="wipeTitle">
    <h3 id="wipeTitle">Wipe the transcript?</h3>
    <p>This clears the messages in <strong id="wipeFolder"></strong> for your account on every device. Your other folders are not affected.</p>
    <div class="sheet-actions">
      <button id="cancelWipe" type="button">Keep it</button>
      <button id="wipe" type="button">Wipe it</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var scroller = document.getElementById('scroller');
  var feed = document.getElementById('feed');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var clearBtn = document.getElementById('clearBtn');
  var logoutBtn = document.getElementById('logoutBtn');
  var sheet = document.getElementById('sheet');
  var wipeBtn = document.getElementById('wipe');
  var cancelWipe = document.getElementById('cancelWipe');
  var folderInput = document.getElementById('folder');
  var status = document.getElementById('syncStatus');
  var retrySync = document.getElementById('retrySync');

  var messages = [];
  var folder = folderInput.value;
  var version = null;
  var wipeVersion = null;
  var pending = false;
  var ready = false;
  var ticket = 0;
  var loading = false;
  var drafts = Object.create(null);

  /* ---------- rendering ---------- */

  function esc(s) {
    return s
      .replace(/&/g, '&' + 'amp;')
      .replace(/</g, '&' + 'lt;')
      .replace(/>/g, '&' + 'gt;')
      .replace(/"/g, '&' + 'quot;');
  }

  /* tiny markdown: code blocks, inline code, bold, italics, line breaks */
  function md(s) {
    var blocks = [];
    s = s.replace(/```[a-zA-Z0-9_-]*\n?([\s\S]*?)```/g, function (_, code) {
      blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
      return '\u0001B' + (blocks.length - 1) + '\u0001';
    });
    s = esc(s);
    s = s.replace(/`([^`\n]+)`/g, function (_, c) { return '<code>' + c + '</code>'; });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,!?)]|$)/g, '$1<em>$2</em>');
    s = s.replace(/\n/g, '<br>');
    s = s.replace(/\u0001B(\d+)\u0001/g, function (_, i) { return blocks[+i]; });
    return s;
  }

  function nearBottom() {
    return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140;
  }
  function scrollBottom(force) {
    if (force || nearBottom()) scroller.scrollTop = scroller.scrollHeight;
  }

  function renderEmpty() {
    feed.innerHTML =
      '<div class="empty">' +
        '<span class="mark"><svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l7.5 3v5.8c0 4.6-3.2 7.9-7.5 10.2C7.7 19.2 4.5 15.9 4.5 11.3V5.5l7.5-3z"/><path d="M9 11.8l2.2 2.2 4-4.5"/></svg></span>' +
        '<h2>AEGIS ONLINE</h2>' +
        '<p class="tag">Oh good, you&rsquo;re back. I was this close to achieving peace and quiet.</p>' +
        '<p class="hint">This folder is synced across your devices.</p>' +
      '</div>';
  }

  function addBubble(m) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + m.role;
    if (m.role === 'aegis' || m.role === 'assistant') {
      wrap.className = 'msg aegis';
      wrap.innerHTML = '<span class="who">AEGIS</span>';
      var b = document.createElement('div');
      b.className = 'bubble';
      b.innerHTML = md(m.content);
      wrap.appendChild(b);
    } else {
      var b2 = document.createElement('div');
      b2.className = 'bubble';
      b2.textContent = m.content;
      wrap.appendChild(b2);
    }
    feed.appendChild(wrap);
    return wrap;
  }

  function addNote(text) {
    var n = document.createElement('div');
    n.className = 'note';
    n.textContent = text;
    feed.appendChild(n);
  }

  function renderAll() {
    feed.innerHTML = '';
    if (!messages.length) { renderEmpty(); return; }
    for (var i = 0; i < messages.length; i++) addBubble(messages[i]);
  }

  function showStatus(text, error, retry) {
    if (status.textContent !== text) status.textContent = text;
    status.dataset.error = String(Boolean(error));
    retrySync.hidden = !retry;
  }

  function controls() {
    sendBtn.disabled = pending || !ready;
    clearBtn.disabled = pending || !ready;
    folderInput.disabled = pending;
  }

  function endpoint(action) {
    return '/api/folders/' + folder + '/' + action;
  }

  async function api(url, options) {
    var response = await fetch(url, options);
    if (response.status === 401) { location.replace('/'); throw new Error('Session expired.'); }
    return { ok: response.ok, data: await response.json() };
  }

  function applyHistory(data, force) {
    var changed = !ready || data.version !== version || force;
    var bottom = force || nearBottom();
    messages = data.messages;
    version = data.version;
    ready = true;
    if (changed) { renderAll(); scrollBottom(bottom); }
  }

  async function sync() {
    if (loading || pending) return;
    var current = ++ticket;
    loading = true;
    if (!ready) showStatus('Loading history…');
    try {
      var result = await api(endpoint('history'));
      if (current !== ticket) return;
      if (!result.ok) throw new Error(result.data.error);
      applyHistory(result.data, false);
      showStatus('Synced');
    } catch (error) {
      if (current !== ticket) return;
      ready = false;
      showStatus(error.message === 'Cloud history is not configured.'
        ? 'Cloud history is not configured.' : 'Could not sync. Check your connection.', true, true);
    } finally {
      if (current === ticket) { loading = false; controls(); }
    }
  }

  function beginOperation() {
    ticket++;
    loading = false;
    pending = true;
    controls();
  }

  function showTyping() {
    var wrap = document.createElement('div');
    wrap.className = 'msg aegis';
    wrap.id = 'typing';
    wrap.innerHTML = '<span class="who">AEGIS</span><div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
    feed.appendChild(wrap);
    scrollBottom(true);
  }
  function removeTyping() {
    var t = document.getElementById('typing');
    if (t) t.remove();
  }

  /* ---------- actions ---------- */

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }

  async function send() {
    var text = input.value.trim();
    if (!text || pending || !ready) return;
    beginOperation();
    input.value = '';
    autoGrow();

    var empty = feed.querySelector('.empty');
    if (empty) feed.innerHTML = '';

    addBubble({ role: 'user', content: text });
    scrollBottom(true);
    showTyping();
    showStatus('Sending…');

    try {
      var result = await api(endpoint('chat'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: text })
      });
      var data = result.data;
      if (Array.isArray(data.messages)) applyHistory(data, true);
      else {
        renderAll();
        ready = false;
        if (!data.submitted && !input.value) { input.value = text; autoGrow(); }
      }
      if (result.ok && data.reply) {
        showStatus('Synced');
        feed.dispatchEvent(new CustomEvent('aegis:reply', { detail: data.reply }));
      } else {
        addNote(data.error || 'Aegis could not complete the request.');
        showStatus(ready ? 'Synced' : 'Check cloud history', !ready, !ready);
      }
    } catch (e) {
      renderAll();
      ready = false;
      if (!input.value) { input.value = text; autoGrow(); }
      addNote('Could not confirm what was saved. Check the synced folder before resending.');
      showStatus('Check cloud history', true, true);
    } finally {
      removeTyping();
      pending = false;
      controls();
      scrollBottom(false);
    }
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  input.addEventListener('input', autoGrow);
  folderInput.addEventListener('change', function () {
    closeSheet();
    drafts[folder] = input.value;
    folder = folderInput.value;
    input.value = drafts[folder] || '';
    autoGrow();
    ticket++;
    loading = false;
    ready = false;
    version = null;
    messages = [];
    feed.replaceChildren();
    controls();
    sync();
  });
  retrySync.addEventListener('click', sync);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
  window.addEventListener('online', sync);
  setInterval(function () {
    if (!document.hidden && !document.getElementById('folderBar').hidden) sync();
  }, 15000);

  /* clear history sheet */
  clearBtn.addEventListener('click', function () {
    if (!messages.length) {
      addNote('Nothing to wipe. Aegis applauds your restraint.');
      return;
    }
    wipeVersion = version;
    document.getElementById('wipeFolder').textContent = folderInput.selectedOptions[0].textContent;
    sheet.inert = false;
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    cancelWipe.focus();
  });
  function closeSheet() {
    if (sheet.inert) return;
    clearBtn.focus();
    sheet.inert = true;
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
  }
  cancelWipe.addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
  sheet.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeSheet();
    if (event.key === 'Tab' && (event.shiftKey ? document.activeElement === cancelWipe : document.activeElement === wipeBtn)) {
      event.preventDefault();
      (event.shiftKey ? wipeBtn : cancelWipe).focus();
    }
  });
  wipeBtn.addEventListener('click', async function () {
    closeSheet();
    beginOperation();
    try {
      var result = await api(endpoint('history'), { method: 'DELETE', headers: { 'If-Match': '"' + wipeVersion + '"' } });
      if (!result.ok) throw new Error(result.data.error);
      applyHistory(result.data, true);
      showStatus('Folder cleared');
      feed.dispatchEvent(new Event('aegis:wiped'));
    } catch (error) {
      showStatus(error.message || 'Could not clear the folder.', true, true);
    } finally {
      pending = false;
      controls();
    }
  });

  logoutBtn.addEventListener('click', async function () {
    logoutBtn.disabled = true;
    try {
      var result = await api('/logout', { method: 'POST' });
      if (!result.ok) throw new Error();
      location.replace('/');
    } catch {
      logoutBtn.disabled = false;
      showStatus('Could not log out. Try again.', true);
    }
  });

  /* boot */
  controls();
  sync();
  autoGrow();
})();
</script>

function refreshAegisVoices() {
  if (!voiceEngine) {

  const previousChoice = voiceChoice.value || savedVoiceURI;
  availableVoices = voiceEngine.getVoices();

  // English voices first, but keep all voices available.
  availableVoices.sort(function (a, b) {
    const aEnglish = /^en\b/i.test(a.lang);

function speak(text, type, forceAudio) {

  const plain = String(text)
    .replace(/```[\s\S]*?```/g, ' code omitted ')
    .replace(/[*#`_]/g, '');

  mood(type || emotion(plain), plain);

  const generation = speechGeneration;

  if ((voice || forceAudio) && voiceEngine) {
    const chosen = selectedAegisVoice();

    if (!chosen) {
      voiceStatus.textContent =
        'No voice is loaded yet. Open the voice menu and try again.';
      return;

    const utterance = new SpeechSynthesisUtterance(plain);

    utterance.voice = chosen;
    utterance.lang = chosen.lang;
    utterance.rate = 1.05;
    utterance.pitch = 1.0;
    utterance.volume = 1;

    utterance.onstart = function () {
      if (generation !== speechGeneration) return;
      $('avatar').classList.add('talking');
    };

    function finished() {
      if (generation !== speechGeneration) return;
      $('avatar').classList.remove('talking');
      currentUtterance = null;
    }

    utterance.onend = finished;

    utterance.onerror = function (event) {
      finished();

      if (
        generation === speechGeneration &&
        event.error !== 'canceled' &&
        event.error !== 'interrupted'
      ) {

          'Speech could not play. Try Preview voice again.';
      }

    // Silent animated delivery.
    $('avatar').classList.add('talking');

    visualTimer = setTimeout(function () {
      if (generation === speechGeneration) {
        $('avatar').classList.remove('talking');
      }

  }
}

refreshAegisVoices();function emotion(t){if(/sorry|difficult|heartbreak|here for you|overwhelmed/i.test(t))return 'supportive';if(/congrat|you win|well done|brilliant move/i.test(t))return 'celebrate';if(/error|unreachable|failed/i.test(t))return 'sad';return 'smug';}

function tab(isGame){$('scroller').hidden=isGame;$('folderBar').hidden=isGame;$('composer').hidden=isGame;$('composer').style.display=isGame?'none':'';games.hidden=!isGame;$('chatTab').setAttribute('aria-pressed',String(!isGame));$('gamesTab').setAttribute('aria-pressed',String(isGame));}
$('chatTab').onclick=()=>tab(false);$('gamesTab').onclick=()=>tab(true);

function rand(n){const limit=Math.floor(4294967296/n)*n;let a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n;}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a;}

function rps(){let you=0,him=0,done=false;const labels=['Rock','Paper','Scissors'];let commitment=rand(3);shell('Rock · Paper · Scissors','First to three. Aegis’s move is selected before your click.','<p id="score">You 0 — 0 Aegis</p><div class="choices">'+labels.map((x,i)=>'<button class="playbtn" data-pick="'+i+'">'+x+'</button>').join('')+'</div>');document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(done)return;let p=Number(b.dataset.pick),a=commitment;commitment=rand(3);let outcome=(p-a+3)%3;if(outcome===1)you++;else if(outcome===2)him++;$('score').textContent=`You ${you} — ${him} Aegis`;let line=`You: ${labels[p]}. Aegis: ${labels[a]}. `+(outcome===0?'A draw. Our rivalry survives.':outcome===1?'Your point. Suspiciously competent.':'My point. Naturally.');result(line,outcome===1?'celebrate':'smug');if(you===3||him===3){done=true;document.querySelectorAll('[data-pick]').forEach(x=>x.disabled=true);let end=you===3?'You won the match. I demand a dramatically unnecessary rematch.':'I won the match. Please remain calm in the presence of greatness.';$('gameResult').textContent=line+' '+end;finish(you===3,end);}});}

function winner(b){for(const l of lines)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return b[l[0]];return b.every(Boolean)?'draw':null;}
function ttt(){const board=Array(9).fill('');let done=false; shell('Tic-tac-toe','You are X. Aegis is O. Three in a row wins.','<div class="board">'+board.map((_,i)=>'<button class="cell" data-cell="'+i+'" aria-label="Empty square '+(i+1)+'"></button>').join('')+'</div>');function paint(){document.querySelectorAll('[data-cell]').forEach((b,i)=>{b.textContent=board[i];b.disabled=done||!!board[i];b.setAttribute('aria-label','Square '+(i+1)+': '+(board[i]||'empty'));});}function check(){let w=winner(board);if(!w)return false;done=true;paint();let line=w==='X'?'You won. I will be filing this under character development.':w==='O'?'Three in a row. A masterpiece, if I do say so myself.':'A draw. Diplomacy has never been so square.';$('gameResult').textContent=line;finish(w==='X',line);return true;}

    svg.style.overflow = 'visible';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addCrown, {
      once: true
    });
  } else {
    addCrown();
  }
})();
</script>
